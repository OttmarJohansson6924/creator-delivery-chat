[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "creator-delivery-chat"
version = "0.1.0"
description = "Gate creator asset delivery and open a realtime audience chat room."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[project.scripts]
creator-delivery = "creator_delivery.service:run"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_delivery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
